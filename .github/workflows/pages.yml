name: Deploy to GitHub Pages

on:
  push:
    branches: ["master"]
    paths: ["html/**", "assets/providers/*.svg", "packaging/linux/simplelog.svg"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/configure-pages@v6

      # The page references these by relative path; copy them in rather than duplicating them in git
      - name: Copy site assets
        run: |
          mkdir -p html/assets/providers html/packaging/linux
          cp assets/providers/*.svg html/assets/providers/
          cp packaging/linux/simplelog.svg html/packaging/linux/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: html/

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
