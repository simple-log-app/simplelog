[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "simplelog"
version = "2.1.0"
requires-python = ">=3.11"
dependencies = [
    "PyQt6>=6.6.0,<6.11",
    "boto3>=1.34.0",
    "botocore>=1.34.0",
    "paramiko>=3.4.0",
    "cryptography>=41.0.0",
    "google-cloud-logging>=3.5.0",
    "google-cloud-resource-manager>=1.10.0",
    "azure-monitor-query>=1.2.0",
    "azure-identity>=1.15.0",
]

[project.scripts]
simplelog = "main:main"

[tool.setuptools]
packages = ["panels"]
py-modules = ["ui_theme", "providers", "ui_workers", "worker_base", "ui_widgets", "remote_dialogs", "log_model", "log_view", "sidebar", "main_window", "main", "ui", "workers", "changelog", "cloudwatch", "cloudflare_utils", "ssh_utils", "docker_utils", "vercel_utils", "gcp_utils", "azure_utils", "config_store", "profiles_store", "i18n", "version", "datadog_utils", "elastic_utils", "flyio_utils", "kubernetes_utils", "loki_utils", "railway_utils", "highlight_rules", "highlight_dialog", "connection_state", "http_utils", "heroku_utils", "render_utils", "splunk_utils", "betterstack_utils", "sentry_utils", "journald_utils"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes (unused imports, undefined names, …)
    "I",   # isort
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long — handled per-file where needed
    "UP007", # X | Y union syntax — Qt overloads complain on older interpreters
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401"]  # allow unused imports in test helpers

[tool.pytest.ini_options]
testpaths = ["tests"]
